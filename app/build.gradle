apply plugin: 'com.android.application'

android {
    defaultConfig {
        applicationId "net.kjwon15.noshiftkeyboard"
        compileSdk 37
        minSdkVersion 24
        targetSdkVersion 37
        versionCode 146
        versionName "6.5"
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'net.kjwon15.noshiftkeyboard'
}

dependencies {
}
