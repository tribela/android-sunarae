apply plugin: 'com.android.application'

// Load release signing config from key.properties if present. The file is generated by the
// release CI workflow from GitHub secrets; locally it can be provided for manual release builds.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    defaultConfig {
        applicationId "net.kjwon15.noshiftkeyboard"
        compileSdk 37
        minSdkVersion 24
        targetSdkVersion 37
        versionCode 7
        versionName "1.0.6"
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        // Debug builds get their own applicationId so they can coexist with the release
        // build (and any Play install) on the same device without uninstalling either.
        debug {
            applicationIdSuffix ".debug"
            // Sign debug builds with the same release key when key.properties is present so
            // the signature stays identical across dev machines. Without this, each PC uses
            // its own ~/.android/debug.keystore and switching machines forces an
            // uninstall/reinstall (INSTALL_FAILED_UPDATE_INCOMPATIBLE).
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    namespace 'net.kjwon15.noshiftkeyboard'
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
